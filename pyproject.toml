[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "httpbinx"
dynamic = ["version"]
description = "HTTP Request & Response Service, written in Python + FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "starlette",
    "jinja2",
    "brotli",
    "python-multipart"
]

# Author information
authors = [{ name = "Leo", email = "imleowoo@outlook.com" }]
maintainers = [{ name = "Leo", email = "imleowoo@outlook.com" }]

# License
license = { file = "LICENSE" }

# Classifiers
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
httpbinx = "httpbinx.cli:execute"

[project.urls]
Homepage = "https://github.com/imleowoo/httpbinx"
# Documentation = ""
Repository = "https://github.com/imleowoo/httpbinx"

[tool.pdm]
version = { source = "file", path = "src/httpbinx/__init__.py" }
package-dir = "src"
distribution = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "D101"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "ruff",
    "httpx",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pytest",
]
