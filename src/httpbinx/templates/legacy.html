<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>httpbinx - HTTP Request &amp; Response Service</title>
</head>
<body>
  <h1>httpbinx</h1>
  <p>HTTP Request &amp; Response Service, written in Python + FastAPI.</p>
  <p>See the <a href="/">interactive API documentation</a> for details and examples.</p>
  <h2>Endpoints</h2>
  <ul>
    {% for endpoint in endpoints %}
    <li><a href="{{ endpoint.path }}"><code>{{ endpoint.method }} {{ endpoint.path }}</code></a> {{ endpoint.summary }}</li>
    {% endfor %}
  </ul>
</body>
</html>
